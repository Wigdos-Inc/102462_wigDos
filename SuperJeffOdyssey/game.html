<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Super Jeff 3 Odyssey Jeff</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #87CEEB;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #hud h2 { margin: 0 0 10px 0; color: #FFD700; }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #aaa;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        #back-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.8);
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
        }
        #back-button:hover {
            background: rgba(255, 215, 0, 1);
        }
        #kingdom-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            animation: fadeOut 3s forwards;
            z-index: 50;
            pointer-events: none;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }
    </style>
</head>
<body>
    <a href="index.html" id="back-button">← MENU</a>
    
    <div id="hud">
        <h2>THE SUPER JEFF 3 ODYESSY JEFF</h2>
        <div>Power Soups: <span id="moons">0</span>/<span id="totalMoons">20</span></div>
        <div>Level: <span id="kingdom">Cap Kingdom</span></div>
        <div id="message" style="color: #FFD700; margin-top: 5px;"></div>
    </div>
    <div id="controls">
        WASD: Move | Space: Jump | Shift+Space: Long Jump | Q: Attack | E: Roll | F: Hair Throw | Mouse: Camera | K: Kingdoms
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="kingdom-name"></div>

    <script type="module" src="game.js"></script>
    <script>
        // Theme music
        const gameMusic = new Audio('assets/sound/themesong.mp3');
        gameMusic.loop = true;
        gameMusic.volume = 0.6;
        
        // Play music when page loads
        window.addEventListener('load', () => {
            gameMusic.play().catch(e => {
                console.log('Autoplay blocked, music will start on first interaction');
            });
        });
        
        // Ensure music plays on first user interaction
        let musicStarted = false;
        document.addEventListener('click', () => {
            if (!musicStarted) {
                gameMusic.play();
                musicStarted = true;
            }
        }, { once: true });
    </script>
</body>
</html>
