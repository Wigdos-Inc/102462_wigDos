<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Jeff</title>
<link rel="icon" href="../../assets/images/jeff_pose_1.png">

<style>

body{
    margin:0;
    overflow:hidden;
    background:#ffd92c;
    font-family:"Comic Sans MS", cursive;
}

/* SPLASH */
.splash{
    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;
}

/* animated background light */
.splash::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;

    background:radial-gradient(circle,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        transparent 60%
    );

    animation:bgMove 10s linear infinite;
}

/* vignette */
.splash::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center,
        transparent 40%,
        rgba(0,0,0,0.15) 100%);
}

/* TITLE TEXT */
.title{
    text-align:center;
    margin-bottom:30px;
    z-index:2;
}

.mainTitle{
    font-size:48px;
    font-weight:bold;
    color:white;
    text-shadow:
        -4px -4px 0 black,
         4px -4px 0 black,
        -4px  4px 0 black,
         4px  4px 0 black;

    animation:titleFly 1.5s ease-out forwards,
              titleWobble 3s ease-in-out infinite 2s;
}

.subTitle{
    font-size:26px;
    margin-top:8px;
    color:white;

    text-shadow:
        -3px -3px 0 black,
         3px -3px 0 black,
        -3px  3px 0 black,
         3px  3px 0 black;

    animation:subFly 2s ease-out forwards;
}

/* LOGO */
.logo{
    width:420px;
    max-width:80%;
    z-index:2;
    border-radius: 500%;
    border-style: solid;
    border-width: 5px;

    animation: memeSpin 0.9s cubic-bezier(.1,.9,.2,1) forwards;
}

/* KEYFRAMES */

@keyframes memeSpin {

    0%{
        transform:scale(20) rotate(0deg) skew(30deg,20deg);
        filter:blur(20px);
        opacity:0;
    }

    10%{
        transform:scale(15) rotate(720deg) skew(-25deg,-15deg);
    }

    20%{
        transform:scale(10) rotate(1440deg) skew(20deg,15deg);
    }

    40%{
        transform:scale(5) rotate(2160deg) skew(-15deg,-10deg);
        filter:blur(10px);
    }

    60%{
        transform:scale(2) rotate(2880deg) skew(10deg,5deg);
        filter:blur(3px);
    }

    80%{
        transform:scale(1.2) rotate(3240deg);
        filter:blur(0);
    }

    90%{
        transform:scale(0.9) rotate(3300deg);
    }

    100%{
        transform:scale(1) rotate(3600deg);
    }

}

/* title flying in */
@keyframes titleFly{

    0%{
        transform:translateY(-300px) rotate(-15deg);
        opacity:0;
    }

    70%{
        transform:translateY(20px) rotate(3deg);
        opacity:1;
    }

    100%{
        transform:translateY(0);
    }

}

/* subtitle slide */
@keyframes subFly{

    0%{
        transform:translateY(-200px);
        opacity:0;
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }

}

/* wobble animation */
@keyframes titleWobble{

    0%{ transform:rotate(0deg) }
    25%{ transform:rotate(1deg) }
    50%{ transform:rotate(-1deg) }
    75%{ transform:rotate(1deg) }
    100%{ transform:rotate(0deg) }

}

/* dramatic zoom entrance */
@keyframes introZoom{

    0%{
        transform:scale(0.2) rotate(-20deg);
        opacity:0;
    }

    60%{
        transform:scale(1.1) rotate(5deg);
        opacity:1;
    }

    80%{
        transform:scale(0.95) rotate(-2deg);
    }

    100%{
        transform:scale(1) rotate(0deg);
    }
}

/* floating idle motion */
@keyframes floaty{

    0%{ transform:translateY(0px) }
    50%{ transform:translateY(-10px) }
    100%{ transform:translateY(0px) }

}

/* glowing pulse */
@keyframes glow{

    0%{
        filter:drop-shadow(0 0 0px white);
    }

    50%{
        filter:drop-shadow(0 0 25px rgba(255,255,255,0.9));
    }

    100%{
        filter:drop-shadow(0 0 0px white);
    }

}

/* moving background highlight */
@keyframes bgMove{

    0%{
        transform:translate(-25%,-25%) rotate(0deg);
    }

    100%{
        transform:translate(-25%,-25%) rotate(360deg);
    }

}

</style>
</head>

<body>

<div class="splash">

    <div class="title">
        <div class="mainTitle">Super Jeff 4 The Super Jeff Moonshine</div>
        <div class="subTitle">& Jakey's BEEF JERRKYY</div>
    </div>

    <img src="../../assets/images/rejeffanimated_logo.png" class="logo">

</div>

<audio id="introAudio" autoplay>
    <source src="../../assets/sound/intro_audio.mp3" type="audio/mpeg">
</audio>

<script>

const audio = document.getElementById("introAudio");
audio.volume = (localStorage.getItem("volume") || 60) / 100;

audio.addEventListener("ended", () => {
    window.location.href = "intro.html";
});

/* fallback */
setTimeout(()=>{
    window.location.href="intro.html";
},5000);

</script>

</body>
</html>
