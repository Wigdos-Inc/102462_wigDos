<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="1920" height="1080"></canvas>

    <script type="module">
        import EngineModule from './../../jeffsgine/jeffsgine.js';
        let engine = null;
        let TexBuffer = null;

        const width = 32;
        const height = 32;

        // Define 4 RGBA colors
        const colors = [
            [255, 0, 0, 255],    // red
            [0, 255, 0, 255],    // green
            [0, 0, 255, 255],    // blue
            [255, 255, 0, 255]   // yellow
        ];

        const pixels = new Uint8Array(width * height * 4);

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                // pick color based on position (checker pattern)
                const colorIndex = ((x % 2) + (y % 2) * 2) % colors.length;
                const color = colors[colorIndex];

                const idx = (y * width + x) * 4;
                pixels[idx]     = color[0]; // R
                pixels[idx + 1] = color[1]; // G
                pixels[idx + 2] = color[2]; // B
                pixels[idx + 3] = color[3]; // A
            }
        }

        //for (let y = 0; y < height; y++) {
            //for (let x = 0; x < width; x++) {
                //const o = (y * width + x) * 4;
                //pixels[o] = Math.floor(Math.random() * 255);
                //pixels[o +1] = Math.floor(Math.random() * 255);
                //pixels[o +2] = Math.floor(Math.random() * 255);
                //pixels[o +3] = 255;
            //}
        //}

        async function loadEngine() {
            const Module = await EngineModule();
            console.log(Module);
            engine = new Module.Engine;
            TexBuffer = new Module.TexBuffer;

            for (let i = 0; i < pixels.length; i++) {
                TexBuffer.push_back(pixels[i]);
            }

            engine.engineInit();
            update();
        }

        function update() {
            engine.engineUpdate({x: 5, y: 5, z: 10}, {x: 0, y: 0, z: 0});
            engine.drawCube(0,0,0, 3,3,3, {x: 0.9, y: 0.8, z: 0.18});
            engine.drawTexCube(0,4,0, 3,3,3, {x: 0.9, y: 0.8, z: 0.18}, true, {width: width, height: height, pixels: TexBuffer});
            engine.drawSphere(5,0,0, 2, {x: 0.2, y: 0.6, z: 0.9});
            engine.drawCylinder(-5,0,0, 1, 3, {x: 0.8, y: 0.2, z: 0.5});

            requestAnimationFrame(update);
        }

        loadEngine();
    </script>
</body>
</html>
