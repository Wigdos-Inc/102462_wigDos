<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Super Jeff 3 Odyssey Jeff</title>
    <link rel="icon" href="assets/images/jeff_pose_1.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/mainmenu.css">
    <link rel="stylesheet" href="src/css/sliders.css">
</head>
<body>
    <div class="menu">
        <!--<div class="main-title">THE SUPER JEFF<br>ODDYSSEY V2</div>-->
        <div style="margin-bottom: 40%;"></div>

        <div class="menu-options">
            <a href="src/html/introSplash.html" class="menu-button">
                START GAME
            </a>

            <a href="src/html/game.html?kingdom=cascade" class="menu-button">
                SELECT LEVEL
            </a>

            <a href="src/html/music.html" class="menu-button">
                JEFF OST
            </a>
        </div>

        <div class="version-info">v2.0 - Moonshine Edition</div>

        <div class="audio-ui">
            <label for="volume">🔊</label>
            <input type="range" id="volume" min="0" max="100" value="80">
        </div>
    </div>

    <!-- background music -->
    <audio id="menu-music" src="assets/sound/jeff's song (3).mp3" loop preload="auto"></audio>

    <script>
        const volume = document.getElementById('volume');
        const menuMusic = document.getElementById('menu-music');

        volume.value = (localStorage.getItem("volume") || 60);
        function startMusic() {
            const random = Math.floor(Math.random() * 10);
            console.log(random);
            switch(random) {
                case 1:
                    menuMusic.src = 'assets/sound/mayonaise mayonaise mayonaise mayonaise .mp3';
                    break;
                case 3:
                    menuMusic.src = 'assets/sound/rats.mp3';
                    break;
                case 5:
                    menuMusic.src = 'assets/sound/skubudobody skubudobody skubudobody skub.mp3';
                    break;
                case 7:
                    menuMusic.src = 'assets/sound/JeffInsanity.mp3';
                    break;
                case 9:
                    menuMusic.src = 'assets/sound/mainmenu.mp3';
                    break;
                default:
                    menuMusic.src = "assets/sound/jeff's song (3).mp3";
            }

            if (menuMusic.paused) {
                menuMusic.volume = volume.value / 100;
                menuMusic.play().catch(() => {});
            }
            document.removeEventListener('click', startMusic);
        }

        volume.addEventListener("input", () => {
            menuMusic.volume = volume.value / 100;
            localStorage.setItem("volume", volume.value);
        });

        document.addEventListener('click', startMusic, { once: true });
    </script>
</body>
</html>
