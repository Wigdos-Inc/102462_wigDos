<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiggyEditor - 3D Game Editor</title>
    <link rel="stylesheet" href="src/editor/styles.css">
    <link rel="icon" href="images/logo.png">
</head>
<body>
    <script src="src/engine/globals.js"></script>
    <script type="module">
        //let BurtCore = null;

        // if (window.location.href.includes('102462_wigDos')) {
        //     BurtCore = await fetch(BurtCorePath);
        // } else {
        //     BurtCore = await import('../BurtEngine/core/BurtEngine.js');
        // }

        let BurtCore = await import('../BurtEngine/BurtCore.min.js');
        BurtCore = BurtCore.BurtCore;

        window.Engine = BurtCore;
        window.Matrix4 = new BurtCore.Mat4;
        window.canvas = document.getElementById('canvas');

        canvas.addEventListener("contextmenu", (event) => {
            event.preventDefault();
        });
    </script>

    <!-- Engine Rendering -->
    <script src="src/engine/SceneEditor.js"></script>
    
    <!-- WigLang Compiler -->
    <script src="src/compiler/WigLangLexer.js"></script>
    <script src="src/compiler/WigLangParser.js"></script>
    <script src="src/compiler/WASMGenerator.js"></script>
    <script src="src/compiler/WigLangCompiler.js"></script>

    <script src="src/misc/Compress.js"></script>
    <script src="src/misc/loadproject.js"></script>
    <script src="src/misc/ui.js"></script>
    
    <!-- Frontend Editor Scripts -->
    <script src="src/editor/AssetManager.js"></script>

    <script src="src/builder/jstemplates.js"></script>
    <script src="src/editor/ProjectBuilder.js"></script>

    <script src="src/editor/ProjectManager.js"></script>
    <script src="src/editor/EditorUI.js"></script>
    <script src="src/editor/GameObjectManager.js"></script>
    <script src="src/editor/ScriptEditor.js"></script>
    <script src="src/editor/Inspector.js"></script>

    <script>
        // Initialize project manager when page loads
        window.addEventListener('load', () => {
            if (window.ProjectManager && typeof window.ProjectManager.initialize === 'function') {
                window.ProjectManager.initialize();
            } else {
                console.error('ProjectManager failed to load');
            }
        });
    </script>
</body>
</html>
