<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperJeff Cart Racing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/icon.jpg">
</head>
<body>
    <div id="character-select">
        <h1>🏎️ Select Your Character</h1>
        <div class="character-buttons">
            <button id="btn-superjeff" class="selected">SuperJeff</button>
            <button id="btn-carl">Carl</button>
            <button id="btn-wally">Wally</button>
        </div>
        <div class="engine-buttons">
           <!-- <button id="btn-engine-legacy" class="selected">Legacy Renderer</button>
            <button id="btn-engine-v1">Engine v1 (Preview)</button> -->
        </div>
        <div class="character-info">
            <div id="character-desc">
                <strong>SuperJeff</strong><br>
                The original champion with blue shirt and distinctive hair!
            </div>
            <button id="btn-start-race" style="margin-top: 20px; font-size: 18px; padding: 12px 40px; border: 2px solid #ffd700; background: #333; color: white; border-radius: 8px; cursor: pointer; font-weight: bold;">START RACE! 🚀</button>
        </div>
    </div>
    <div id="ui" style="display: none;">
        <div id="controls">
            <strong>🎮 CONTROLS</strong><br>
            <span class="key">↑</span> <span class="key">W</span> Vooruit<br>
            <span class="key">↓</span> <span class="key">S</span> Achteruit/Rem<br>
            <span class="key">←</span> <span class="key">D</span> Links<br>
            <span class="key">→</span> <span class="key">A</span> Rechts<br>
            <span class="key">Shift</span> Drift<br>
            <span class="key">Space</span> Item gebruiken<br>
            <span class="key">C</span> Camera wisselen
        </div>
        <div id="lap-info">
            <div><strong>🏁 LAP:</strong> <span id="current-lap">1</span> / 3</div>
            <div><strong>⏱️ TIME:</strong> <span id="time">0:00.0</span></div>
        </div>
        <div id="position-info">
            <strong>📍 POS:</strong> <span id="position">1</span>/<span id="total-racers">6</span>
        </div>
        <div id="item-display">
            <span id="current-item">❓</span>
        </div>
        <div id="speedometer">
            <strong>💨 SPEED:</strong> <span id="speed">0</span> km/h
        </div>
    </div>

    <script type="module" src="src/boot.js"></script>
    
    <script type="module">
        console.log(ENGINE);

        ENGINE.Config.VOLUME.Music = 0.1;

        const characterSelect = document.getElementById('character-select');
        const charDesc = document.getElementById('character-desc');
        const startBtn = document.getElementById('btn-start-race');
        const engineLegacyBtn = document.getElementById('btn-engine-legacy');
        const engineV1Btn = document.getElementById('btn-engine-v1');
        let selectedCharacter = 'superjeff';
        let selectedEngine = 'legacy';

        const src = new URL("assets/sounds/1. Super Jeffinated.mp3", import.meta.url).href;
        ENGINE.Audio.PlayMusic("SUPER_JEFF_CART_THEME", src, { loop: true, volume: 0.5 });

        const characters = {
            superjeff: {
                name: 'SuperJeff',
                desc: 'The original champion with blue shirt and distinctive hair!'
            },
            carl: {
                name: 'Carl',
                desc: 'A friendly purple octopus with 8 tentacles, big green eyes, and a cheeky smile! 🐙'
            },
            wally: {
                name: 'Wally',
                desc: 'A tough biker with a yellow helmet, big mustache, and muscular build. Ready to dominate! 💪'
            }
        };

        document.getElementById('btn-superjeff').addEventListener('click', () => {
            selectCharacter('superjeff');
        });
        document.getElementById('btn-carl').addEventListener('click', () => {
            selectCharacter('carl');
        });
        document.getElementById('btn-wally').addEventListener('click', () => {
            selectCharacter('wally');
        });
        //engineLegacyBtn.addEventListener('click', () => {
            //selectEngine('legacy');
        //});
        //engineV1Btn.addEventListener('click', () => {
            //selectEngine('v1');
        //});

        function selectCharacter(name) {
            selectedCharacter = name;

            document.getElementById('btn-superjeff').classList.remove('selected');
            document.getElementById('btn-carl').classList.remove('selected');
            document.getElementById('btn-wally').classList.remove('selected');
            document.getElementById(`btn-${name}`).classList.add('selected');

            const char = characters[name];
            charDesc.innerHTML = `<strong>${char.name}</strong><br>${char.desc}`;
        }

        function selectEngine(mode) {
            selectedEngine = mode === 'v1' ? 'v1' : 'legacy';
            //engineLegacyBtn.classList.remove('selected');
            engineV1Btn.classList.remove('selected');

            if (selectedEngine === 'v1') {
                engineV1Btn.classList.add('selected');
            } else {
                //engineLegacyBtn.classList.add('selected');
            }
        }

        async function startGame() {
            characterSelect.style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            //window.location.href = `game.html?character=${selectedCharacter}&engine=${selectedEngine}`;
            //window.location.href += `?character=${selectedCharacter}&engine=${selectedEngine}`;
            await import("./src/main_engine_v1.js");
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGame();
            }
        });

        if (startBtn) {
            startBtn.addEventListener('click', startGame);
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('engine') === 'v1') {
            selectEngine('v1');
        } else {
            //selectEngine('legacy');
        }

        if (urlParams.has('character')) {
            characterSelect.style.display = 'none';
            document.getElementById('ui').style.display = 'block';

            const totalRacersSpan = document.getElementById('total-racers');
            if (totalRacersSpan) {
                totalRacersSpan.textContent = '6';
            }
        }
    </script>
</body>
</html>
