<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxZone - Sign Up</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">BloxZone</div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div style="max-width: 500px; width: 100%;">
            <h1 class="text-center" style="margin-bottom: 30px;">Sign Up for BloxZone</h1>
    
    <form id="signup-form">
        <label>Username:</label><br>
        <input type="text" id="username" required minlength="3"><br><br>
        
        <label>Password:</label><br>
        <input type="password" id="password" required minlength="6"><br><br>
        
        <label>Confirm Password:</label><br>
        <input type="password" id="confirm-password" required><br><br>
        
        <button type="submit">Sign Up</button>
    </form>
    
    <p id="message"></p>
    
    <p class="text-center" style="margin-top: 20px; color: var(--text-secondary);">Already have an account? <a href="login.html" style="color: var(--accent-color);">Login here</a></p>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 BloxZone. All rights reserved.</p>
    </footer>
    
    <script src="../js/auth.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (password !== confirmPassword) {
                document.getElementById('message').textContent = 'Passwords do not match';
                return;
            }
            
            const result = register(username, password);
            if (result.success) {
                document.getElementById('message').textContent = 'Registration successful! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                document.getElementById('message').textContent = result.message;
            }
        });
    </script>
</body>
</html>
