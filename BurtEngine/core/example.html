<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../BurtLogo.jpg">
    
    <style>
        #canvas {
            position: absolute;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
        }
    </style>

</head>
<body>
    <canvas id="canvas" width="1920" height="1080"></canvas>

    <script type="module">
        import {BurtCore} from './BurtEngine.js';

        window.Engine = BurtCore;

        const canvas = document.getElementById('canvas');
        const renderer = new Engine.WebGLRenderer(canvas);

        renderer.gridVisible = false;
        renderer.backgroundColor = [0,0.7,1,1];

        const camera = new Engine.FreeCamera();
        const scene = [];

        const cubeGeometry = Engine.GeometryBuilder.createBox();
        const cubeMesh = new Engine.Mesh(renderer, cubeGeometry);

        scene[0] = cubeMesh;

        const GLBParser = new Engine.GLBParser(renderer, camera);
        const BurtModel = await GLBParser.loadGLB('../Burt_model_static.glb');

        const BurtGeometry = GLBParser.ConvertToFlatMesh(BurtModel);

        const BurtMesh = new Engine.Mesh(renderer, BurtGeometry);

        BurtMesh.position.y = 15;
        BurtMesh.updateMatrix();

        BurtMesh.setTexture(BurtModel.textures.texture_0.sourceImage.dataUri)

        scene[1] = BurtMesh;

        //console.log(BurtModel, cubeGeometry, BurtGeometry)

        const heightmap = await Engine.Texture.OpenTexture('../heightmap_256x256.png');
        //const noise = new Engine.SimplexNoise.SimplexNoise(Math.random());
        const noise = new Engine.SimplexNoise.NoiseImage(heightmap.pixels, heightmap.width, heightmap.height);

        const landscapeGeometry = Engine.Landscape.generateLandscape(0, 0, 0, 256, noise);
        const landscapeMesh = new Engine.Mesh(renderer, landscapeGeometry);

        landscapeMesh.position.z -= 50;
        landscapeMesh.updateMatrix();

        landscapeMesh.setTexture('https://www.all3dfree.net/uploads/5/1/9/6/51967249/choppy_green_grass_textures_seamless_18.jpg');

        scene[2] = landscapeMesh;

        const landscapeCollisions = Engine.CollisionShapes.GenerateCollision(landscapeGeometry);

        camera.isControlled = true;

        Engine.Orbit.setCurrentCamera(camera);
        Engine.Orbit.OrbitInit();

        const CubeA = new Engine.CollisionShapes.Sphere(BurtMesh.position, 1);
        const CubeB = new Engine.CollisionShapes.OBB(new Engine.Vec3(), Engine.CollisionShapes.createAxes(), new Engine.Vec3(0.5,0.5,0.5));

        const TriA = new Engine.CollisionShapes.Triangle(new Engine.Vec3(10,0,0), new Engine.Vec3(0,0,10), new Engine.Vec3(-10,0,0));

        const test = new Engine.Audio('../Burt_World_Theme.mp3');
        await test.init();
        test.volume = 0.01;
        test.loop = true;
        //test.pitch = 0.7;
        test.play();

        function main() {
            camera.update(0.016, Engine.Orbit.getKeys());

            let collide = false;
            // for (let i = 0; i < landscapeCollisions.length; i++) {
            //     if (Engine.Collision.collide(CubeA, landscapeCollisions[i])) {
            //         collide = true;
            //         break;
            //     }
            // }

            collide = Engine.Collision.collide(CubeA, CubeB);
            //collide = Engine.Collision.collide(CubeA, TriA);

            if (!collide) {
                BurtMesh.position.y -= 0.1;
                CubeA.center.y = BurtMesh.position.y;
            }

            cubeMesh.rotation.y += 0.01;
            cubeMesh.updateMatrix();

            BurtMesh.rotation.y += 0.05;
            BurtMesh.updateMatrix();

            renderer.render(scene, camera);
            requestAnimationFrame(main);
        }

        canvas.addEventListener("contextmenu", (event) => {
            event.preventDefault();
        });

        main();
    </script>
</body>
</html>
