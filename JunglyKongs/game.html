<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JunglyKongs — Game</title>
  <link rel="icon" href="assets/img/detailed_jugnlyKong.png">
  <style>
    body{margin:0;overflow:hidden;font-family:'Comic Sans MS',cursive,sans-serif;background:#000}
    #game-root{position:absolute;left:0;top:0;right:0;bottom:0}
    #ui-overlay{position:absolute;top:0;left:0;right:0;padding:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:100}
    #back-btn{padding:12px 24px;background:rgba(255,200,50,0.95);border:3px solid #8b4513;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;pointer-events:all;box-shadow:0 4px 8px rgba(0,0,0,0.4);transition:all 0.2s}
    #back-btn:hover{background:rgba(255,220,70,1);transform:scale(1.05)}
    #stats{background:rgba(0,0,0,0.75);padding:18px 30px;border-radius:15px;border:3px solid rgba(255,200,50,0.85);color:white;font-size:20px;text-shadow:2px 2px 4px rgba(0,0,0,0.9)}
    .stat-row{display:flex;align-items:center;margin:8px 0}
    .stat-label{color:#ffeb3b;margin-right:12px;font-weight:bold}
    .stat-value{color:#fff;font-size:26px;font-weight:bold}
    #controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);padding:18px 30px;border-radius:15px;border:3px solid rgba(255,200,50,0.7);color:white;text-align:center;font-size:15px;pointer-events:none}
    #controls div{margin:6px 0}
    .key{display:inline-block;background:rgba(255,200,50,0.35);padding:4px 10px;border-radius:6px;border:1px solid rgba(255,200,50,0.9);margin:0 3px;font-weight:bold}
  </style>
</head>
<body>
  <div id="game-root"></div>
  
  <div id="ui-overlay">
    <button id="back-btn" onclick="location.href='index.html'">← Menu</button>
    <div id="stats">
      <div class="stat-row"><span class="stat-label">Score:</span><span class="stat-value" id="score">0</span></div>
      <div class="stat-row"><span class="stat-label">🍌 Bananas:</span><span class="stat-value" id="bananas">0/0</span></div>
    </div>
  </div>
  
  <div id="controls">
    <div><span class="key">WASD</span> or <span class="key">Arrow Keys</span> to Move</div>
    <div><span class="key">Space</span> to Jump | <span class="key">Shift</span> to Roll</div>
    <div><span class="key">Q</span> Coconut Gun | <span class="key">E</span> Punch | <span class="key">R</span> High Kick</div>
  </div>
  
  <script type="module" src="js/main.js"></script>
</body>
</html>
