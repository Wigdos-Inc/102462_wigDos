<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JunglyKongs — Main Menu</title>
  <link rel="icon" href="assets/img/detailed_jugnlyKong.png">
  <style>
    :root{--bg:#07100c;--accent:#ffcf2f}
    html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#07100c 0%, #0b1612 60%);color:#fff;}

    .wrap{height:100%;display:flex;flex-direction:column}
    header{padding:18px 28px;display:flex;align-items:center;gap:12px}
    .logo{font-weight:900;font-size:26px;color:var(--accent);letter-spacing:2px;text-shadow:0 6px 20px rgba(0,0,0,.6)}
    .subtitle{opacity:.85}

    .stage{flex:1;position:relative;overflow:hidden}
    #three{position:absolute;left:0;top:0;right:0;bottom:0}

    /* UI overlay */
    .ui{position:absolute;left:24px;top:90px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.08));padding:12px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.04)}
    .title{font-size:64px;font-weight:900;color:var(--accent);text-shadow:0 10px 30px rgba(0,0,0,.8)}
    .menu{margin-top:18px;display:flex;flex-direction:column;gap:10px}
    .btn{background:var(--accent);color:#000;padding:10px 16px;border-radius:8px;border:none;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)}
    .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,.08);color:#fff}

    .credit{position:absolute;right:18px;bottom:14px;color:#bdbdbd;font-size:12px}

    /* overlay hints */
    .hint{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;color:#ddd;opacity:.9;font-size:13px}

    /* small responsive tweaks */
    @media (max-width:700px){ .title{font-size:36px} .ui{left:12px;top:56px} }

    /* placeholders for no WebGL */
    .no-webgl{display:none;padding:28px;background:#2b2b2b;color:#fff;border-radius:8px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">JunglyKongs</div>
      <div class="subtitle">— Adventure</div>
    </header>

    <div class="stage">
      <div id="three"></div>

      <div class="ui">
        <div class="title">ADVENTURE</div>
        <div class="menu">
          <button class="btn" id="startBtn">Start Game</button>
          <button class="btn secondary" id="optionsBtn">Options</button>
          <button class="btn secondary" id="creditsBtn">Credits</button>
        </div>
        <div style="margin-top:10px">
          <button class="btn secondary" id="musicBtn">Mute Music</button>
        </div>
      </div>

      <div class="hint">Use <strong>Start</strong> to enter the intro (temporary).</div>
      <div class="credit">© JunglyKongs — procedural assets</div>
      <div class="no-webgl" id="noWebgl">Your browser does not support WebGL. Try a modern browser.</div>
    </div>
  </div>

  <audio id="menuMusic" src="assets/music/mainmenu.mp3" loop crossorigin="anonymous"></audio>

  <script> 
    // Minimal WebGL + Three.js main menu with procedural apes and a crocodile peeking in.
    const startBtn = document.getElementById('startBtn');
    const optionsBtn = document.getElementById('optionsBtn');
    const creditsBtn = document.getElementById('creditsBtn');
    const noWebgl = document.getElementById('noWebgl');

    // lazy load three
    function loadScript(url){ return new Promise((res,reject)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=reject; document.head.appendChild(s); }); }

    async function init(){
      if(!window.WebGLRenderingContext){ noWebgl.style.display='block'; return; }
      await loadScript('https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js');

      const container = document.getElementById('three');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, container.clientWidth/container.clientHeight, 1, 4000); camera.position.set(0, 220, 900);
      const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(container.clientWidth, container.clientHeight); container.appendChild(renderer.domElement);
      renderer.shadowMap.enabled = true; scene.background = new THREE.Color(0x07100c);

      // lights
      const amb = new THREE.AmbientLight(0xffffff, 0.45); scene.add(amb);
      const key = new THREE.DirectionalLight(0xffe8b8, 1.0); key.position.set(200,700,200); key.castShadow=true; scene.add(key);

      // floor
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000,1500), new THREE.MeshStandardMaterial({color:0x2f6b2b, roughness:1})); floor.rotation.x=-Math.PI/2; floor.position.y=-20; floor.receiveShadow=true; scene.add(floor);

      // groups
      const mainGroup = new THREE.Group(); scene.add(mainGroup);
      const bgGroup = new THREE.Group(); scene.add(bgGroup);
      const villGroup = new THREE.Group(); scene.add(villGroup);

      // helper: create ape (matches the rap_intro procedural ape)
      function createApe(color=0x8b5a2b, scale=1){
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({color, roughness:0.85, metalness:0.02, flatShading:true});
        const dark = new THREE.MeshStandardMaterial({color:0x352216, roughness:0.95, flatShading:true});

        // torso
        const torso = new THREE.Mesh(new THREE.BoxGeometry(120,100,80), mat); torso.position.set(0,20,0); torso.castShadow=true; g.add(torso);

        // head
        const head = new THREE.Mesh(new THREE.IcosahedronGeometry(46,0), mat); head.position.set(0,78,6); head.castShadow=true; g.add(head);

        // muzzle
        const muzzle = new THREE.Mesh(new THREE.BoxGeometry(64,30,34), dark); muzzle.position.set(0,66,40); muzzle.castShadow=true; g.add(muzzle);

        // eyes
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(6,6,6), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9, flatShading:true})); eyeL.position.set(-14,86,58); g.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(6,6,6), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9, flatShading:true})); eyeR.position.set(14,86,58); g.add(eyeR);
        const pL = new THREE.Mesh(new THREE.SphereGeometry(2.5,6,6), new THREE.MeshStandardMaterial({color:0x000000})); pL.position.set(-14,86,64); g.add(pL);
        const pR = new THREE.Mesh(new THREE.SphereGeometry(2.5,6,6), new THREE.MeshStandardMaterial({color:0x000000})); pR.position.set(14,86,64); g.add(pR);

        // arms (groups for rotation)
        const armL = new THREE.Group(); const upperL = new THREE.Mesh(new THREE.BoxGeometry(20,80,20), mat); upperL.position.set(-50,-10,0); upperL.castShadow=true; upperL.rotation.z = -0.2; armL.add(upperL); armL.position.set(-76,40,0); g.add(armL);
        const armR = new THREE.Group(); const upperR = new THREE.Mesh(new THREE.BoxGeometry(20,80,20), mat); upperR.position.set(50,-10,0); upperR.castShadow=true; upperR.rotation.z = 0.2; armR.add(upperR); armR.position.set(76,40,0); g.add(armR);

        // legs
        const legL = new THREE.Mesh(new THREE.BoxGeometry(28,70,28), dark); legL.position.set(-28,-40,10); legL.castShadow=true; g.add(legL);
        const legR = new THREE.Mesh(new THREE.BoxGeometry(28,70,28), dark); legR.position.set(28,-40,10); legR.castShadow=true; g.add(legR);

        // belly
        const belly = new THREE.Mesh(new THREE.BoxGeometry(60,40,44), new THREE.MeshStandardMaterial({color:0xf2d7a6, roughness:0.9, flatShading:true})); belly.position.set(0,12,38); belly.castShadow=true; g.add(belly);

        g.userData = {head, armL, armR, legL, legR, torso}; g.scale.setScalar(scale);
        return g;
      }

      // main jungly kong (center) holding a barrel
      const main = createApe(0xd96e24, 1.3); main.position.set(0,40,0); mainGroup.add(main);
      // barrel
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(60,60,80,12), new THREE.MeshStandardMaterial({color:0xa65b2b,roughness:0.85})); barrel.position.set(0,120,12); barrel.castShadow=true; mainGroup.add(barrel);

      // additional rap-intro styled kong (left) to reuse the same look
      const rapKong = createApe(0xd96e24, 1.05); rapKong.position.set(-260,40,40); mainGroup.add(rapKong);
      // little bob for rapKong
      (function rapBob(){ const t = performance.now(); rapKong.position.y = 40 + Math.sin(t*0.002)*6; requestAnimationFrame(rapBob); })();

      // background kongs running left -> right in loop
      const bgCount = 4; const bgApeInfo = [];
      for(let i=0;i<bgCount;i++){
        const a = createApe(0x7dbb6c, 0.85); a.position.set(-800 + i*400, 16, -120 + (i%2)*40); bgGroup.add(a);
        bgApeInfo.push({group:a, speed: 0.6 + Math.random()*0.6, offset: Math.random()*10});
      }

      // crocodile villain (patent-free stylized croc) peeking from side
      function createCroc(){
        const g = new THREE.Group();
        const green = new THREE.MeshStandardMaterial({color:0x4f8c3a, flatShading:true, roughness:0.9});
        const snout = new THREE.Mesh(new THREE.BoxGeometry(140,60,60), green); snout.position.set(0,40,0); snout.castShadow=true; g.add(snout);
        const head = new THREE.Mesh(new THREE.BoxGeometry(80,70,80), green); head.position.set(0,100,8); head.castShadow=true; g.add(head);
        const tooth = new THREE.Mesh(new THREE.BoxGeometry(8,12,4), new THREE.MeshStandardMaterial({color:0xffffff})); tooth.position.set(60,80,22); g.add(tooth);
        g.position.set(1200,20,-40); g.rotation.y = Math.PI; // facing scene
        return g;
      }

      const croc = createCroc(); villGroup.add(croc);

      // soft shadows under main and bg
      const shadowTex = (()=>{ const c = document.createElement('canvas'); c.width=c.height=256; const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(128,128,10,128,128,128); g.addColorStop(0,'rgba(0,0,0,0.8)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); })();
      const shMat = new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false});
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(320,160), shMat); sh.rotation.x = -Math.PI/2; sh.position.set(0,-22,20); sh.material.opacity = 0.8; scene.add(sh);

      // subtle camera movement variables
      let camTarget = new THREE.Vector3(0,180,900);

      // timed croc peek logic
      let lastPeek = 0;
      function maybePeek(time){
        if(time - lastPeek > 4000 + Math.random()*6000){ // intervals between 4–10s
          lastPeek = time;
          // animate croc from right side to partially visible and back
          const startX = 1200; const inX = 520; const outX = 1200;
          const duration = 900; const hold = 1200;
          const startTime = performance.now();
          function step(){
            const now = performance.now(); const dt = now - startTime;
            if(dt < duration){
              const t = dt / duration; croc.position.x = startX + (inX - startX) * easeOutCubic(t); requestAnimationFrame(step);
            } else if(dt < duration + hold){
              requestAnimationFrame(step);
            } else if(dt < duration*2 + hold){
              const t2 = (dt - duration - hold) / duration; croc.position.x = inX + (outX - inX) * easeInCubic(t2); requestAnimationFrame(step);
            } else { croc.position.x = outX; }
          }
          step();
        }
      }

      function easeOutCubic(t){ return (--t)*t*t+1; }
      function easeInCubic(t){ return t*t*t; }

      // main animation loop
      function animate(){
        const t = performance.now();
        // background kongs move
        bgApeInfo.forEach((info, idx)=>{
          info.group.position.x += info.speed * (1 + Math.sin(t*0.001+info.offset)*0.2);
          if(info.group.position.x > 1200) info.group.position.x = -1200;
          // arm swinging while running
          const s = Math.sin(t*0.01 + idx);
          info.group.userData = info.group.userData || {};
          if(!info.group.userData.init){ info.group.userData.armL = info.group.children.find(c=>c.type==='Group'); info.group.userData.init = true; }
          const armL = info.group.userData.armL; if(armL) armL.rotation.z = -0.6 + s*0.8;
        });

        // main kong idle animation
        const mainT = Math.sin(t*0.002);
        main.position.y = 40 + Math.sin(t*0.002)*6;
        main.userData.head.rotation.y = Math.sin(t*0.001)*0.12;
        // barrel little bob
        barrel.position.y = 120 + Math.sin(t*0.002)*6;

        // maybe croc peek
        maybePeek(t);

        // camera slight bob
        camera.position.x += (camTarget.x - camera.position.x) * 0.05;
        camera.position.y += (camTarget.y - camera.position.y) * 0.05;
        camera.position.z += (camTarget.z - camera.position.z) * 0.05;
        camera.lookAt(0,80,0);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      // window resize
      window.addEventListener('resize', ()=>{ camera.aspect = container.clientWidth/container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });

      // interactive buttons
      startBtn.addEventListener('click', ()=>{ location.href = 'rap_intro.html'; });
      optionsBtn.addEventListener('click', ()=>{ alert('Options placeholder'); });
      creditsBtn.addEventListener('click', ()=>{ alert('Created with procedural models.'); });

    }

    init().catch(e=>{ console.error('Could not initialize 3D menu', e); document.getElementById('noWebgl').style.display='block'; });

    // Background music setup: try autoplay muted, unmute on first gesture, and provide a toggle button
    (function(){
      const menuMusic = document.getElementById('menuMusic');
      const musicBtn = document.getElementById('musicBtn');
      if(!menuMusic) return;

      // Attempt muted autoplay for browsers that allow it
      menuMusic.muted = true;
      menuMusic.volume = 0.9;
      menuMusic.loop = true;
      menuMusic.play().catch(()=>{});

      let musicStarted = false;
      function handleFirstInteraction(){
        if(!musicStarted){
          menuMusic.muted = false;
          menuMusic.play().catch(()=>{});
          musicStarted = true;
          if(musicBtn) musicBtn.textContent = 'Mute Music';
        }
      }

      // Unmute/play on first any click or when Start is clicked
      document.addEventListener('click', handleFirstInteraction, {once:true});
      const startEl = document.getElementById('startBtn'); if(startEl) startEl.addEventListener('click', handleFirstInteraction);

      // Toggle button
      if(musicBtn){
        musicBtn.addEventListener('click', function(e){ e.stopPropagation(); menuMusic.muted = !menuMusic.muted; musicBtn.textContent = menuMusic.muted ? 'Unmute Music' : 'Mute Music'; });
      }

      // Pause music when leaving page visibility
      document.addEventListener('visibilitychange', ()=>{ if(document.hidden) menuMusic.pause(); else if(!menuMusic.paused) menuMusic.play().catch(()=>{}); });
    })();
  </script>
</body>
</html>
