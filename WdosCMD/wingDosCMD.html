<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WingDOS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body{
            background-color: black;
        }

        .cursor{
            width: 1.5vw !important;
            height: 2px !important;
            line-height: 4.2vh !important;
            margin-top: 4vh !important;
            background-color: white !important;
        }
        .blinking-cursor{
            animation: blink;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-play-state: running;
        }

        @keyframes blink {
            0%{opacity: 1;}
            50%{opacity: 0;}
            100%{opacity: 1;}
        }
    </style>
</head>
<body>
    <div id="screen_container">
        <div style="white-space: pre; font: 14px monospace; line-height: 4vh; font-size: 2.5vw; user-select: none;"></div>
        <canvas style="display: none"></canvas>
    </div>

    <script src="libv86.js"></script>
    <script>
        const hdaBuffer = new Uint8Array(100 * 1024 * 1024);
        let hdbBuffer = null;
        let emulator = null;
        hdaBuffer.fill(0);
        let running = false;

        let mem8 = null;
        let mem32 = null;
        const MEM_L = 8;
        const MEM_W = 4;
        const MEM_S = 2;
        const MEM_B = 1;

        function SetupPC(noFetch, HDbuffer){
            if(running){return;}
            running = true;

            if(!noFetch){
                fetch("fat32disk.img")
                .then(res => res.arrayBuffer())
                .then(buf => {
                    hdbBuffer = new Uint8Array(buf);
                    emulator = createPC();
                })
                .catch(err => {
                    hdbBuffer = new Uint8Array(100 * 1024 * 1024);
                    hdbBuffer.fill(0);
                    emulator = createPC();
                });
            }
            else{
                hdbBuffer = new Uint8Array(HDbuffer);
                emulator = createPC();
            }
        }

        function createPC(){
            const emulator = new V86({
                wasm_path: "v86.wasm",
                memory_size: 32 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "bochs-bios.bin" },
                vga_bios: { url: "bochs-vgabios.bin" },
                hda: { url: "customunix.img" },
                hdb: hdbBuffer,
                //cdrom: {url: "disk.iso"},
                autostart: true,
                debug: true,
            });
            return emulator;
        }

        function waitRam(){
            return new Promise((resolve) => {
                const check = () => {
                    setTimeout(() => {
                        mem8 = emulator.v86.cpu.mem8;
                        mem32 = emulator.v86.cpu.mem32s;
                        if(mem8){
                            //console.log("Ram is loaded!");
                            resolve(mem8);
                        }
                        else{
                            requestAnimationFrame(check);
                        }
                    }, 1000);
                };
                check();
            });
        }

        async function SaveHDD(){
            const hdb = emulator.disk_images.hdb;
            if(!hdb){return;}

            if(hdb.async){await hdb.async;}

            const data = new Uint8Array(hdb.buffer);
            const blob = new Blob([data], {type: "application/octet-stream"});
            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "hdb.img";
            a.click();
        }

        function Peek(adrs, len, bit, source){
            let result = [];
            for(let j = 0; j < len; j++){
                let curval = 0;
                for(let i = 0; i < bit; i++){
                    curval = (curval << 8) | source[(adrs +i) + (j * bit)];
                }
                result[j] = curval;
            }
            return result;
        }
        function Poke(adrs, val, bit, source){
            for(let j = 0; j < val.length; j++){
                let parsedval = [];

                switch(bit){
                    case MEM_B:parsedval[0] = val[j];break;
                    case MEM_S:{
                        parsedval[0] = val[j] & 0x00FF;
                        parsedval[1] = (val[j] >> 8) & 0x00FF;
                        break;
                    }
                    case MEM_W:{
                        parsedval[0] = val[j] & 0x000000FF;
                        parsedval[1] = (val[j] >> 8) & 0x000000FF;
                        parsedval[2] = (val[j] >> 16) & 0x000000FF;
                        parsedval[3] = (val[j] >> 24) & 0x000000FF;
                        break;
                    }
                }

                for(let i = 0; i < bit; i++){
                    source[adrs +i +j] = parsedval[i];
                }
            }
        }

        window.addEventListener('message', (e) => {
            const pack = e.data;
            if(e.source !== window.parent){return;}
            if(!pack.data){return;}

            if(pack.type == "SETUP_CMD"){
                SetupPC(true, pack.data);
            }

            waitRam().then(() => {
                let source = null;
                switch(pack.src){
                    case "mem8":source = mem8;break;
                    case "mem32":source = mem32;break;
                    case "hdb":source = hdbBuffer;break;
                }

                switch(pack.type){
                    case "CMD_PEEK":{
                        if(source == null){window.parent.postMessage({type: "ERROR", data: "**No valid source was given**"});return;}
                        const PeekDat = Peek(pack.data[0], pack.data[1], pack.data[2], source);
                        window.parent.postMessage({type: "PEEK", data: PeekDat});
                        break;
                    }
                    case "CMD_POKE":{
                        if(source == null){window.parent.postMessage({type: "ERROR", data: "**No valid source was given**"});return;}
                        Poke(pack.data[0], pack.data[1], pack.data[2], source);
                        break;
                    }
                }
            });
        });

        const url = new URL(window.location.href);

        if (!url.searchParams.has("autostart")) {
            SetupPC();
            waitRam().then(() => {
                console.log("CMD has auto started ...");
            });
        }
    </script>
</body>
</html>
